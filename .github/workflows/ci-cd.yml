name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      php-version: ${{ steps.php.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build test environment
        run: |
          docker compose -f compose.test.yaml build --pull tests
          docker compose -f compose.test.yaml build firmware-build
      - name: Verify test PHP runtime
        id: php
        run: |
          expected=$(sed -nE 's/^FROM php:([0-9]+\.[0-9]+\.[0-9]+)-fpm-alpine AS base$/\1/p' docker/Dockerfile)
          test -n "$expected"
          actual=$(docker compose -f compose.test.yaml run --rm --no-deps tests php -r 'echo PHP_VERSION;')
          printf 'Test PHP: expected %s, got %s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          echo "version=$expected" >> "$GITHUB_OUTPUT"
      - name: Backend tests, formatting and types
        run: |
          docker compose -f compose.test.yaml run --rm tests
          docker compose -f compose.test.yaml run --rm tests vendor/bin/pint --test
          docker compose -f compose.test.yaml run --rm tests composer typecheck
      - name: Firmware tests and Arduino compilation
        run: |
          docker compose -f compose.test.yaml run --rm firmware-tests
          docker compose -f compose.test.yaml run --rm firmware-build sh -c 'g++ -std=c++17 -Wall -Wextra -Werror -I/root/Arduino/libraries/ArduinoJson/src firmware/tests/payload_test.cpp -o /tmp/payload-test && /tmp/payload-test tests/fixtures/results.json'
          docker compose -f compose.test.yaml run --rm firmware-build
      - name: Validate deployment scripts and production HTTP access
        run: |
          bash -n deploy/activate-release.sh
          shellcheck deploy/activate-release.sh tests/vps-smoke.sh tests/deployment-test.sh
          docker run --rm -v "$PWD:/src:ro" -w /src debian:bookworm-slim bash tests/deployment-test.sh
          bash tests/vps-smoke.sh
      - name: Stop test containers
        if: always()
        run: docker compose -f compose.test.yaml down

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: lotto-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      EXPECTED_PHP_VERSION: ${{ needs.checks.outputs.php-version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Skip a superseded commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; skipping this deployment.'
          fi
      - name: Build an immutable production release
        if: steps.current.outputs.deploy == 'true'
        run: |
          docker build --pull --target production -f docker/Dockerfile -t "lotto-display-backend:$GITHUB_SHA" .
          actual=$(docker run --rm --entrypoint php "lotto-display-backend:$GITHUB_SHA" -r 'echo PHP_VERSION;')
          printf 'Production PHP: expected %s, got %s\n' "$EXPECTED_PHP_VERSION" "$actual"
          test "$actual" = "$EXPECTED_PHP_VERSION"
          mkdir -p release
          docker save "lotto-display-backend:$GITHUB_SHA" | gzip > release/backend-image.tar.gz
          cp compose.yaml compose.nginx.yaml deploy/activate-release.sh release/
          printf 'BACKEND_IMAGE=lotto-display-backend:%s\nEXPECTED_PHP_VERSION=%s\n' "$GITHUB_SHA" "$EXPECTED_PHP_VERSION" > release/release.env
      - name: Configure SSH
        if: steps.current.outputs.deploy == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lotto-ci
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/lotto-ci ~/.ssh/known_hosts
      - name: Transfer and activate
        if: steps.current.outputs.deploy == 'true'
        run: |
          destination="/home/lotto-deploy/lotto-esp32/releases/$GITHUB_SHA"
          ssh -i ~/.ssh/lotto-ci -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "lotto-deploy@$VPS_HOST" "mkdir -p '$destination'"
          scp -i ~/.ssh/lotto-ci -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            release/* "lotto-deploy@$VPS_HOST:$destination/"
          ssh -i ~/.ssh/lotto-ci -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "lotto-deploy@$VPS_HOST" "bash '$destination/activate-release.sh' '$destination'"
