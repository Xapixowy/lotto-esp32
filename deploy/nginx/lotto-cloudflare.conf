# Replace lotto.example.com with LOTTO_DOMAIN before installing.
# The Origin Certificate must cover the Lotto hostname.
server {
    listen 80;
    listen [::]:80;
    server_name lotto.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lotto.example.com;

    ssl_certificate /etc/ssl/cloudflare/lotto.pem;
    ssl_certificate_key /etc/ssl/cloudflare/lotto.key;

    access_log /var/log/nginx/lotto-access.log;
    error_log /var/log/nginx/lotto-error.log;

    include /etc/nginx/snippets/lotto-cloudflare-real-ip.conf;
    include /etc/nginx/snippets/lotto-proxy.conf;
}
