# LOTTO_DOMAIN=lotto.jakubchodzinski.pl; update both server_name entries if it changes.
# Reuse staging's wildcard Origin Certificate after verifying Lotto hostname coverage.
server {
    listen 80;
    listen [::]:80;
    server_name lotto.jakubchodzinski.pl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lotto.jakubchodzinski.pl;

    ssl_certificate /etc/ssl/cloudflare/papai-staging.pem;
    ssl_certificate_key /etc/ssl/cloudflare/papai-staging.key;

    access_log /var/log/nginx/lotto-access.log;
    error_log /var/log/nginx/lotto-error.log;

    # Verified against https://www.cloudflare.com/ips-v4 and /ips-v6 on 2026-10-05.
    # Recheck the official lists when deploying or updating this file.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    # This path is inside the PHP container; no Laravel files are needed on the host.
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;
    fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    fastcgi_connect_timeout 5s;
    fastcgi_read_timeout 10s;
    fastcgi_send_timeout 10s;

    location = /api/results {
        fastcgi_pass 127.0.0.1:18090;
        add_header Cache-Control "no-store" always;
    }

    location = /up {
        fastcgi_pass 127.0.0.1:18090;
    }

    location / {
        return 404;
    }
}
