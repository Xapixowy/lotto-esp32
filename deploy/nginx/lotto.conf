# Replace lotto.example.com with LOTTO_DOMAIN before installing.
# Certbot adds HTTPS to this initial HTTP virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name lotto.example.com;

    access_log /var/log/nginx/lotto-access.log;
    error_log /var/log/nginx/lotto-error.log;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_cache off;

    location = /api/results {
        proxy_pass http://127.0.0.1:18080;
        add_header Cache-Control "no-store" always;
    }

    location = /up {
        proxy_pass http://127.0.0.1:18080;
    }

    location / {
        return 404;
    }
}
